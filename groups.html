<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les groupes — Informatique</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-icon">💻</span><span>Informatique</span></a>
  <a class="back-link" href="index.html">← Accueil</a>
</header>

<main class="container groups-page">
  <div class="page-heading">
    <p class="eyebrow">👥 Groupes</p>
    <h1>Programme des groupes</h1>
  </div>

  <div id="todayBanner" class="today-banner"></div>

  <section class="schedule-card">
    <div class="schedule-header">
      <div>
        <h2>📅 Planning des séances</h2>
        <p>Le groupe affiché correspond à la séance réellement programmée.</p>
      </div>
      <select id="classFilter" class="quiz-select" aria-label="Filtrer par classe">
        <option value="all">Toutes les classes</option>
      </select>
    </div>

    <div id="scheduleView" class="schedule-view"></div>

  </section>

  <section class="schedule-card holiday-calendar"><div class="schedule-header"><div><h2>🏖️ Vacances et jours fériés</h2><p>Calendrier 2026-2027 intégré au planning.</p></div></div><div id="holidayList" class="holiday-list"></div></section>

  <section id="nextSession" class="next-session"></section>
</main>

<footer class="footer">© 2026 — Espace Informatique</footer>
<script src="js/app.js"></script>
</body>
</html>
